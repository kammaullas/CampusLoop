services:
  - type: web
    name: campusloop
    runtime: node
    plan: starter
    buildCommand: npm run install:all && npm run build
    startCommand: node server/index.js
    disk:
      name: campusloop-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/campusloop.db
      - key: CAMPAIGN_GOAL
        value: 500
      - key: CAMPAIGN_START_DATE
        value: 2026-11-01
      - key: CAMPAIGN_DAYS
        value: 7
      - key: ADMIN_TOKEN
        generateValue: true
